[package]
name = "chili-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true

[dependencies]
chili-parser = { path = "../chili-parser" }
polars = { workspace = true, default-features = true, features = [
  "abs",
  "concat_str",
  "cov",
  "cum_agg",
  "cross_join",
  "diff",
  "dtype-array",
  "dtype-categorical",
  "dtype-decimal",
  "dtype-i16",
  "dtype-u16",
  "dtype-struct",
  "dtype-u8",
  "dynamic_group_by",
  "ewma",
  "interpolate",
  "is_between",
  "is_in",
  "ipc",
  "ipc_streaming",
  "lazy",
  "list_sets",
  "list_any_all",
  "log",
  "mode",
  "moment",
  "ndarray",
  "offset_by",
  "parquet",
  "pct_change",
  "polars-ops",
  "polars-io",
  "random",
  "range",
  "rank",
  "regex",
  "rolling_window",
  "round_series",
  "row_hash",
  "timezones",
  "search_sorted",
  "serde",
  "serde-lazy",
  "sign",
  "string_pad",
  "strings",
  "top_k",
  "trigonometry",
  "unique_counts",
  "object",
] }
indexmap = "2.12.0"
glob = "0.3"
rayon = "1.11.0"
polars-arrow = { workspace = true }
polars-buffer = { workspace = true }
ndarray = "0.17"
chrono = { workspace = true }
whoami = "2.1.0"
log = "0.4"
indicatif = "0.18"
thiserror = "2.0"
anyhow = "1.0"
regex = "1.12"
chumsky = { workspace = true }
ariadne = { workspace = true }
lru = "0.18.0"
parking_lot = "0.12"
# Sprint 21 (ADR-0006 — mdata push-model D-1). crossbeam-channel: the
# bounded back-pressure queue; libc: the POSIX self-pipe + fcntl
# (macOS has no eventfd/pipe2). Versions match the existing Cargo.lock
# pins (0.5.15 / 0.2.186) — promoted from transitive to direct, no
# lockfile churn.
crossbeam-channel = "0.5"
libc = "0.2"
sysinfo = "0.39"
serde_json = "1.0"
unicode-width = "0.2"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"
serial_test = "3"
# Sprint 21 — upd_notify_test.rs polls/fcntls the self-pipe fd and
# builds trivial DataFrame payloads for UpdEventCore.
libc = "0.2"
polars = { workspace = true }

[[bench]]
name = "parse_cache"
harness = false
